name: Build

# Every push to main and every pull request. Nothing here publishes anything -- release.yml owns
# that, and it is reached only by a tag. A `push` naming only `branches` does not fire for tags
# at all, which is the whole of how a `v*` push is left to the other workflow. The mirror of that
# rule is a trap worth naming: a `push` naming only `tags` does not fire for branches, so
# `tags-ignore: '**'` reads like "everything except tags" and means "nothing at all".
on:
  push:
    branches:
      - main
  pull_request:

# A superseded push has nothing left to say. This does not collapse the push/PR pair above:
# those carry different refs and so land in different groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Named rather than left to the default, which is `bash -e` with no pipefail.
    shell: bash

jobs:
  # Both linters are here because this repo's whole release path runs through the shell script.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Every third-party action here is pinned to a commit rather than a tag, because a tag can
      # be repointed at any time and these run with access to the workspace. The trailing comment
      # is the version that commit was, for whoever bumps it.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint's release binary rather than an action wrapping it or its container: one fewer
      # third party with access to the workspace, and no pull from Docker Hub, whose rate limit
      # can fail this job before any of it has run. The pin is the version plus the sha256 that
      # release's own checksums file gives for the asset, checked before anything is unpacked.
      # Both are recorded here because a `run:` script is invisible to Dependabot. The binary
      # finds the runner's shellcheck on PATH and runs it over every `run:` block.
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Two invocations, and the split is what keeps this clean without suppressing anything.
      #
      # The rootfs scripts are the entry points only -- the shared library they source is not
      # named here. `-x` with `--source-path=rootfs` resolves its absolute `source` path inside
      # the tree and analyses it in the context that uses it, which is the only context where its
      # variables are used at all: linting it on its own would report every path it defines as
      # unused and need an exclusion to say otherwise. `--shell=bash` because s6's
      # `#!/command/with-contenv bash` is a shebang shellcheck does not know, and the alternative
      # is a directive in each of five shipped files.
      #
      # The second invocation carries `-x` too, because pactl_parse_test.sh sources that same
      # library to test it, and `SCRIPTDIR` resolves its relative `source` path against the
      # script rather than the working directory the run happened to start in.
      #
      # shellcheck is the runner image's preinstall and floats with it, unlike actionlint above:
      # GitHub-maintained tooling that fails loud at lint time does not need a digest of its own.
      - name: Lint the shell scripts
        run: |
          shellcheck --shell=bash --external-sources --source-path=rootfs \
            rootfs/usr/bin/container-healthcheck \
            rootfs/usr/lib/sendspin-cli/decide-daemons \
            rootfs/etc/s6-overlay/s6-rc.d/*/run \
            rootfs/etc/s6-overlay/s6-rc.d/*/finish
          shellcheck -x --source-path=SCRIPTDIR scripts/*.sh

      # Needs no image, so it runs beside the linters rather than behind a build that compiles
      # the player from source.
      - name: Test the pactl parsing
        run: scripts/pactl_parse_test.sh

      # Here rather than in the add-on job for the same reason as the one above: it reads a
      # scratch copy of the manifest and needs nothing but bash and awk.
      - name: Test the security-rating check
        run: scripts/security_rating_test.sh

      # Here for the reason the two above are: they read this repository's own files and need
      # nothing built. Between them they cover everything release.yml assembles a Release out of,
      # and release.yml runs only on a tag -- so a pull request that breaks either is caught here
      # or it is caught by the release.
      - name: Test the release-notes assembly
        run: scripts/release_notes_test.sh

      - name: Test the pinned compose file
        run: scripts/compose_pinned_test.sh

      # sync-store.yml fires on release.yml's `name:`, and GitHub matches the pair silently: a
      # renamed Release would unhook the store sync with no symptom anywhere. Asserted here so
      # the renaming pull request itself goes red.
      - name: Check the workflow-name coupling the store sync rides on
        run: |
          release_name="$(sed -nE 's/^name:[[:space:]]*(.*[^[:space:]])[[:space:]]*$/\1/p' .github/workflows/release.yml | head -1)"
          [ -n "$release_name" ] || {
            echo "::error::could not read a name: from release.yml"
            exit 1
          }
          awk -v n="$release_name" '$1 == "-" && $2 == n { found = 1 } END { exit !found }' \
            .github/workflows/sync-store.yml || {
            echo "::error::release.yml is named '$release_name' but sync-store.yml's workflow_run list does not carry it -- the store sync would silently never fire"
            exit 1
          }

  # The add-on manifest is what the Home Assistant add-on store reads, and one the Supervisor
  # rejects is a card that never appears -- a failure with no local symptom at all. This is the
  # only check anywhere that can see it, so it is worth its own job.
  #
  # Nothing here is guarded on local_audio/ existing: a guarded step would go on reporting green
  # after a rename, and a rename is exactly what is worth catching.
  addon-lint:
    name: add-on manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `community` is left at its default: everything past the linter's build-file section is
      # gated on that input, and that branch requires the version to be literally `dev` and a
      # build.json to exist. This add-on has a real version and no build file, because its image
      # is prebuilt rather than built by the store, so turning this on would fail it on both
      # counts.
      - name: Lint the add-on manifest
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./local_audio

      # The linter above checks the manifest's schema; this checks its posture. A key that
      # costs a point of the Supervisor's 1-8 rating has no other symptom -- the add-on
      # installs, runs and lints exactly as before, and the number only shows on the store card.
      - name: Check the add-on's security rating
        run: scripts/security_rating.sh

      # A no-op on the runner image as it stands. It is here because the check below refuses to
      # skip when the binary is missing, and going red over an absent package is not the point.
      - name: Make sure apparmor_parser is installed
        run: |
          if ! command -v apparmor_parser >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends apparmor
          fi

      # The profile is worth a point of that rating, but only if it loads, and a typo in it is
      # invisible everywhere else. Compiled and never handed to the kernel, so this needs no
      # privilege and changes nothing about the runner.
      - name: Parse the AppArmor profile
        run: scripts/apparmor_check.sh

  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # The build compiles the player from source and then runs the smoke suite twice. Well clear
    # of that, and far under the six-hour default, so that a container which ignores SIGTERM
    # fails a leg instead of holding a runner all day.
    timeout-minutes: 60
    strategy:
      # Every leg's result, not just the first failure's: a break that shows on one architecture
      # and not the other is what the matrix is here to tell apart.
      fail-fast: false
      matrix:
        include:
          # Native runners on both legs, so nothing here needs qemu.
          - arch: amd64
            runner: ubuntu-24.04
            # Both base digests are passed rather than defaulted: the Dockerfile's default is the
            # amd64 one, so the arm64 leg has to be told. The Dockerfile's own comment carries
            # why all three files must move together.
            base: ghcr.io/home-assistant/amd64-base-debian@sha256:9281ee991c28532ddae10114ac84750f4aca287a496f6e19583f3a750ad5e786
            # What `docker image inspect` calls the result, and the third spelling of one thing:
            # the runner label says `arm`, docker says `arm64`, the add-on manifest `aarch64`.
            expect_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            base: ghcr.io/home-assistant/aarch64-base-debian@sha256:acc61c0ab60cbca176ec0fe4d37278be514a4a6babfc1becde951c99d17e92f0
            expect_arch: arm64
    env:
      IMAGE: local-audio:ci
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No assertion on the build output: the Dockerfile greps its own configure log, so a
      # silently degraded player fails the build there rather than here.
      #
      # `docker build` and not buildx, unlike release.yml, which needs buildx to push a digest
      # without a tag. Nothing is published here, so the plain builder is fewer moving parts.
      - name: Build the image
        env:
          BASE: ${{ matrix.base }}
        run: docker build --build-arg "BUILD_FROM=$BASE" --tag "$IMAGE" .

      - name: Check the image is the architecture this leg builds for
        env:
          EXPECT_ARCH: ${{ matrix.expect_arch }}
        run: |
          arch="$(docker image inspect --format '{{.Architecture}}' "$IMAGE")"
          echo "image architecture: $arch"
          [ "$arch" = "$EXPECT_ARCH" ] || {
            echo "::error::built a $arch image on the $EXPECT_ARCH leg -- check BUILD_FROM"
            exit 1
          }

      # The suite's one confined check loads local_audio/apparmor.txt into this runner's kernel
      # and runs a container under it, which is the only place anything here is ever enforced. A
      # no-op on the runner image as it stands, as in the add-on job above.
      - name: Make sure apparmor_parser is installed
        run: |
          if ! command -v apparmor_parser >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends apparmor
          fi

      # Twice, because the two option sources share no code above `sendspin::read_options`.
      # Standalone is what a Compose user gets; add-on is the bashio branch, which nothing else
      # exercises. The script's own header says what each mode covers.
      #
      # `--require-apparmor` because these runners can confine: the confined check is a skip on a
      # developer's machine and a failure anywhere that could have run it.
      - name: Smoke test, standalone mode
        run: scripts/smoke_test.sh "$IMAGE" --mode standalone --require-apparmor

      - name: Smoke test, add-on mode
        run: scripts/smoke_test.sh "$IMAGE" --mode addon --require-apparmor
